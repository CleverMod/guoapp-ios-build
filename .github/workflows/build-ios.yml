name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      refresh_lockfile:
        description: Regenerate and export the Flutter dependency lockfile
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: |
          if [[ "${{ inputs.refresh_lockfile }}" == "true" ]]; then
            flutter pub get
          else
            flutter pub get --enforce-lockfile
          fi
      - name: Check changed Dart formatting
        run: |
          source_commit="$(git log -1 --format=%H -- lib test)"
          while IFS= read -r -d '' source; do
            if [[ -f "$source" ]]; then
              dart format "$source"
            fi
          done < <(git diff-tree --root --no-commit-id --name-only -r -z "$source_commit" -- '*.dart')
          git diff --exit-code -- '*.dart'
      - name: Check iOS build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          pod --version
      - name: Upload dependency lockfile
        if: inputs.refresh_lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flutter-lockfile
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
      - name: Build all-source unsigned IPA
        run: python3 scripts/build_ios.py --all-sources
      - name: Upload IPA and checksums
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-unsigned
          path: |
            dist/ios/*-ios-unsigned.ipa
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
